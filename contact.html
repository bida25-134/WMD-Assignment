<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Lefatshe Mushrooms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Site-wide navigation landmark -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Lefatshe Mushrooms</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content landmark -->
  <main class="container mt-5">

    <!-- Contact / Order section -->
    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact / Order</h1>
      <p class="mt-2">Fill in the form below to place an order enquiry or ask us a question.
        We will get back to you as soon as possible.</p>

      <!-- Order enquiry form -->
      <!-- Each label uses "for" linked to the matching input "id" — required HTML5 standard -->
      <form class="mt-4" id="order-form" novalidate>

        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name"
            placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email"
            placeholder="Enter your email address" required>
        </div>

        <div class="mb-3">
          <label for="product" class="form-label">Product</label>
          <select class="form-select" id="product" name="product" required>
            <option value="" disabled selected>Select a product</option>
            <option value="oyster">Oyster Mushrooms</option>
            <option value="shiitake">Shiitake Mushrooms</option>
            <option value="both">Both Varieties</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity (kg)</label>
          <input type="number" class="form-control" id="quantity" name="quantity"
            placeholder="Enter quantity in kilograms" min="1" required>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="4"
            placeholder="Any additional details or questions..."></textarea>
        </div>

        <button type="submit" class="btn btn-success btn-lg">Submit Enquiry</button>

      </form>
    </section>

  </main>

  <!-- Site-wide footer landmark -->
  <footer class="bg-dark text-white text-center p-3 mt-5">
    <p class="mb-1">© 2026 Lefatshe Mushrooms</p>
    <nav aria-label="Footer navigation">
      <a class="text-white me-3" href="index.html">Home</a>
      <a class="text-white me-3" href="about.html">About</a>
      <a class="text-white me-3" href="products.html">Products</a>
      <a class="text-white me-3" href="gallery.html">Gallery</a>
      <a class="text-white" href="contact.html">Contact</a>
    </nav>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
